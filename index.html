<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>U-PROTECT | CYBER SHIELD PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

:root {
    --blue: #168cff;
    --blue2: #006cff;
    --purple: #713cff;
    --pink: #e53cff;

    --bg: #020711;
    --panel: rgba(4, 12, 24, 0.94);

    --border: rgba(110, 160, 220, 0.22);

    --text: #f8fafc;
    --muted: #8d9bad;
}


/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
    background: #020711;
    overflow: hidden;
}


/* =========================================================
   CYBER BACKGROUND
========================================================= */

.space-bg {
    position: fixed;
    inset: 0;
    z-index: -20;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(0, 102, 255, 0.12) 0%,
            rgba(0, 42, 90, 0.07) 24%,
            transparent 52%
        ),
        radial-gradient(
            circle at 95% 50%,
            rgba(128, 45, 255, 0.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 5% 75%,
            rgba(0, 136, 255, 0.13),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #020711 0%,
            #020914 45%,
            #01050c 100%
        );
}


/* Grid */

.space-bg::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0, 140, 255, 0.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0, 140, 255, 0.045) 1px,
            transparent 1px
        );

    background-size: 42px 42px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            black 12%,
            black 90%,
            transparent 100%
        );
}


/* Stars */

.space-bg::after {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(circle, rgba(0, 153, 255, .9) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(144, 72, 255, .8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255, 255, 255, .45) 1px, transparent 1.5px);

    background-size:
        180px 180px,
        240px 240px,
        310px 310px;

    background-position:
        10px 30px,
        100px 80px,
        40px 120px;

    opacity: .35;
}


/* =========================================================
   CYBER CIRCLES
========================================================= */

.cyber-shield {
    position: absolute;

    width: 690px;
    height: 690px;

    left: 50%;
    top: 55%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid rgba(0, 132, 255, .20);

    box-shadow:
        0 0 0 14px rgba(0, 115, 255, .035),
        0 0 0 28px rgba(0, 115, 255, .025),
        0 0 100px rgba(0, 110, 255, .08);

    animation: shieldRotate 35s linear infinite;
}

.cyber-shield::before,
.cyber-shield::after {
    content: "";
    position: absolute;
    inset: 34px;

    border-radius: 50%;
    border: 1px solid rgba(0, 132, 255, .12);
}

.cyber-shield::after {
    inset: 100px;
    border-color: rgba(115, 60, 255, .10);
}

@keyframes shieldRotate {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }

    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}


/* =========================================================
   DECORATIVE CIRCUIT LINES
========================================================= */

.circuit {
    position: absolute;
    opacity: .45;
    pointer-events: none;
}

.circuit.left {
    left: 0;
    top: 150px;
    width: 270px;
    height: 600px;

    background:
        linear-gradient(90deg, transparent 0 28px, #087cff 28px 30px, transparent 30px),
        linear-gradient(0deg, transparent 0 80px, rgba(0,130,255,.35) 80px 82px, transparent 82px);
}

.circuit.right {
    right: 0;
    top: 145px;
    width: 300px;
    height: 620px;

    background:
        linear-gradient(90deg, transparent 0 50px, rgba(139,67,255,.55) 50px 52px, transparent 52px),
        linear-gradient(0deg, transparent 0 95px, rgba(139,67,255,.25) 95px 97px, transparent 97px);
}


/* =========================================================
   TOP TOOLBAR
========================================================= */

header {
    position: fixed;

    top: 22px;
    left: 11px;
    right: 11px;

    height: 102px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background:
        linear-gradient(
            180deg,
            rgba(7, 17, 31, .96),
            rgba(2, 9, 18, .96)
        );

    border: 1px solid rgba(100, 151, 220, .24);

    border-radius: 11px;

    box-shadow:
        0 15px 50px rgba(0, 0, 0, .45),
        inset 0 1px 0 rgba(255,255,255,.025);

    backdrop-filter: blur(20px);

    z-index: 1000;
}


/* =========================================================
   LOGO
========================================================= */

.logo-area {
    min-width: 235px;

    height: 100%;

    display: flex;
    align-items: center;

    gap: 13px;

    border-right: 1px solid rgba(145, 175, 220, .25);

    padding-right: 20px;
}

.logo-shield {
    position: relative;

    width: 38px;
    height: 44px;

    color: #0b8cff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 37px;

    filter:
        drop-shadow(0 0 7px rgba(0, 130, 255, .75));
}

.logo-shield i {
    position: absolute;
}

.logo-content {
    display: flex;
    align-items: baseline;
    gap: 9px;
}

.logo-main {
    font-family: 'Orbitron', sans-serif;

    font-size: 20px;
    font-weight: 900;

    letter-spacing: 1px;

    color: #0a91ff;

    text-shadow:
        0 0 10px rgba(0, 140, 255, .35);
}

.logo-version {
    font-family: 'Orbitron', sans-serif;

    font-size: 12px;
    font-weight: 500;

    color: #8a94a4;
}


/* =========================================================
   TOOLBAR CENTER
========================================================= */

.toolbar {
    flex: 1;

    height: 100%;

    display: flex;
    align-items: center;

    padding-left: 16px;

    gap: 7px;
}


/* Divider */

.toolbar-divider {
    width: 1px;
    height: 62px;

    background: rgba(150, 170, 205, .20);

    margin: 0 10px;
}


/* =========================================================
   TOOL BUTTON
========================================================= */

.tool-item {
    min-width: 58px;
    height: 76px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 6px;

    border-radius: 7px;

    cursor: pointer;

    color: #8c98a9;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.tool-item i {
    font-size: 25px;
}

.tool-item span {
    font-family: 'Orbitron', sans-serif;

    font-size: 10px;
    font-weight: 500;

    letter-spacing: .5px;

    color: #8d98a8;
}

.tool-item:hover {
    color: white;

    background: rgba(255,255,255,.045);
}

.tool-item:hover i,
.tool-item:hover span {
    color: white;
}

.tool-item.active {
    background:
        linear-gradient(
            180deg,
            rgba(79, 55, 180, .75),
            rgba(63, 42, 151, .55)
        );

    color: white;

    box-shadow:
        inset 0 0 18px rgba(113, 60, 255, .15),
        0 0 22px rgba(84, 55, 220, .18);
}

.tool-item.active i,
.tool-item.active span {
    color: white;
}

.tool-item.active::after {
    content: "";

    position: absolute;
}


/* =========================================================
   COLORS
========================================================= */

.color-area {
    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 6px;

    margin-left: 2px;
}

.color-label {
    font-family: 'Orbitron', sans-serif;

    font-size: 9px;

    letter-spacing: 1px;

    color: #aab4c3;
}

.colors {
    display: flex;
    align-items: center;

    gap: 10px;
}

.swatch {
    width: 28px;
    height: 28px;

    border-radius: 6px;

    border: 2px solid rgba(255,255,255,.08);

    cursor: pointer;

    transition:
        transform .2s ease,
        border .2s ease,
        box-shadow .2s ease;
}

.swatch:hover {
    transform: translateY(-2px) scale(1.05);
}

.swatch.active {
    border-color: #ffffff;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.25),
        0 0 12px rgba(255,255,255,.15);

    transform: scale(1.05);
}


/* =========================================================
   DELETE
========================================================= */

.delete-area {
    display: flex;
    align-items: center;
    justify-content: center;

    min-width: 68px;
    height: 100%;

    border-left: 1px solid rgba(150,170,205,.20);
    border-right: 1px solid rgba(150,170,205,.20);

    margin-left: 10px;
}

.delete-btn {
    color: #ff4b4b !important;
}

.delete-btn:hover {
    background: rgba(255, 55, 55, .08);

    color: #ff6666 !important;
}


/* =========================================================
   ZOOM
========================================================= */

.zoom-area {
    min-width: 160px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-left: 10px;
}

.zoom-btn {
    width: 35px;
    height: 35px;

    border-radius: 7px;

    border: 1px solid rgba(100, 140, 190, .20);

    background: rgba(255,255,255,.025);

    color: #c9d2de;

    cursor: pointer;

    font-size: 17px;
}

.zoom-btn:hover {
    background: rgba(255,255,255,.08);

    color: white;
}

.zoom-value {
    min-width: 70px;

    height: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 7px;

    border: 1px solid rgba(100, 140, 190, .20);

    background: rgba(255,255,255,.025);

    color: white;

    font-size: 12px;
    font-weight: 700;
}


/* =========================================================
   EXPORT BUTTON
========================================================= */

.export-btn {
    height: 52px;

    min-width: 160px;

    margin-left: 12px;

    border-radius: 7px;

    border: 1px solid rgba(120, 68, 255, .7);

    background:
        linear-gradient(
            135deg,
            #2533a8,
            #713cff
        );

    color: white;

    font-family: 'Orbitron', sans-serif;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: .3px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    box-shadow:
        0 0 22px rgba(99, 60, 255, .18);

    transition: .25s ease;
}

.export-btn i {
    font-size: 16px;
}

.export-btn:hover {
    transform: translateY(-1px);

    box-shadow:
        0 0 28px rgba(99, 60, 255, .35);
}


/* =========================================================
   VIEWPORT
========================================================= */

.viewport {
    position: relative;

    width: 100%;
    height: 100vh;

    overflow: auto;

    padding:
        155px
        20px
        70px;

    display: flex;
    flex-direction: column;
    align-items: center;

    scroll-behavior: smooth;
}


/* =========================================================
   HERO
========================================================= */

.hero-sec {
    width: 100%;

    min-height: calc(100vh - 210px);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding-bottom: 25px;

    animation: heroIn 1s ease-out;
}

@keyframes heroIn {
    from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}


/* =========================================================
   HERO TITLE
========================================================= */

.hero-h1 {
    margin: 0;

    font-family: 'Orbitron', sans-serif;

    font-size: clamp(50px, 5vw, 76px);

    line-height: 1.03;

    font-weight: 900;

    letter-spacing: -2px;

    background:
        linear-gradient(
            90deg,
            #128bff 0%,
            #247cff 27%,
            #7542ed 62%,
            #e63cff 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 35px rgba(0, 110, 255, .15);
}


/* =========================================================
   HERO SUBTITLE
========================================================= */

.hero-subtitle {
    position: relative;

    margin: 25px 0 42px;

    font-family: 'Orbitron', sans-serif;

    font-size: 14px;

    font-weight: 500;

    letter-spacing: 4px;

    color: #b4bdca;

    text-transform: uppercase;
}

.hero-subtitle::before,
.hero-subtitle::after {
    content: "";

    position: absolute;

    top: 50%;

    width: 100px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #0d8cff
        );
}

.hero-subtitle::before {
    right: calc(100% + 18px);
}

.hero-subtitle::after {
    left: calc(100% + 18px);

    background:
        linear-gradient(
            90deg,
            #8c43ff,
            transparent
        );
}


/* =========================================================
   UPLOAD BOX
========================================================= */

.upload-box {
    width: 480px;
    max-width: 90vw;

    min-height: 225px;

    border: 1px dashed rgba(160, 170, 190, .58);

    border-radius: 26px;

    background:
        linear-gradient(
            135deg,
            rgba(10, 22, 38, .82),
            rgba(4, 12, 23, .88)
        );

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    position: relative;

    overflow: hidden;

    transition:
        border .3s ease,
        background .3s ease,
        transform .3s ease;
}

.upload-box::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0, 130, 255, .08),
            transparent 50%
        );

    pointer-events: none;
}

.upload-box:hover {
    border-color: rgba(0, 145, 255, .75);

    background:
        linear-gradient(
            135deg,
            rgba(10, 27, 50, .9),
            rgba(5, 13, 27, .95)
        );

    transform: translateY(-3px);

    box-shadow:
        0 15px 45px rgba(0, 80, 255, .08);
}

.upload-icon {
    font-size: 54px;

    margin-bottom: 18px;

    background:
        linear-gradient(
            135deg,
            #008cff,
            #7641ff
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(0 0 10px rgba(0, 120, 255, .35));
}

.upload-title {
    font-family: 'Orbitron', sans-serif;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: .3px;

    color: #f4f7fb;

    margin-bottom: 11px;
}

.upload-subtitle {
    font-size: 14px;

    color: #8793a4;
}


/* =========================================================
   PAGE
========================================================= */

.page-node {
    position: relative;

    margin-bottom: 60px;

    background: white;

    transition:
        transform .4s cubic-bezier(.16,1,.3,1);

    box-shadow:
        0 30px 80px rgba(0,0,0,.9);

    transform-origin: center center;
}


/* =========================================================
   PAGE INDICATOR
========================================================= */

.page-indicator {
    position: absolute;

    top: -35px;
    right: 0;

    background:
        rgba(45, 82, 170, .90);

    color: white;

    padding: 5px 13px;

    border-radius: 4px;

    font-family: 'Orbitron', sans-serif;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1px;

    pointer-events: none;

    white-space: nowrap;

    border-left: 3px solid #00a2ff;
}


/* =========================================================
   REDACTION
========================================================= */

.layer-draw {
    position: absolute;

    inset: 0;

    cursor: crosshair;

    z-index: 10;
}

.mask-unit {
    position: absolute;

    z-index: 11;
}

.mask-unit.selected {
    outline: 3px solid #00eaff;

    box-shadow:
        0 0 15px rgba(0, 234, 255, .45);
}

.mask-unit.circle {
    border-radius: 50%;
}


/* =========================================================
   FILE INPUT
========================================================= */

#fileIn {
    display: none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1250px) {

    .logo-area {
        min-width: 190px;
    }

    .tool-item {
        min-width: 48px;
    }

    .toolbar-divider {
        margin: 0 4px;
    }

    .colors {
        gap: 5px;
    }

    .swatch {
        width: 24px;
        height: 24px;
    }

    .export-btn {
        min-width: 135px;
    }

    .zoom-area {
        min-width: 130px;
    }
}


@media (max-width: 1000px) {

    header {
        height: auto;
        min-height: 100px;

        overflow-x: auto;
    }

    .logo-area {
        min-width: 160px;
    }

    .logo-main {
        font-size: 16px;
    }

    .toolbar {
        min-width: 700px;
    }

    .viewport {
        padding-top: 145px;
    }
}

</style>
</head>


<body>


<!-- ======================================================
     BACKGROUND
====================================================== -->

<div class="space-bg">
    <div class="cyber-shield"></div>
    <div class="circuit left"></div>
    <div class="circuit right"></div>
</div>


<!-- ======================================================
     TOP TOOLBAR
====================================================== -->

<header>


    <!-- LOGO -->

    <div class="logo-area">

        <div class="logo-shield">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="logo-content">

            <div class="logo-main">
                U-PROTECT
            </div>

            <div class="logo-version">
                V.01
            </div>

        </div>

    </div>



    <!-- TOOLBAR -->

    <div class="toolbar">


        <!-- REFRESH -->

        <div class="tool-item"
             onclick="location.reload()">

            <i class="fa-solid fa-rotate"></i>

            <span>REFRESH</span>

        </div>


        <div class="toolbar-divider"></div>


        <!-- DRAW -->

        <div class="tool-item active"
             id="m-draw"
             onclick="setMode('draw')">

            <i class="fa-solid fa-pencil"></i>

            <span>DRAW</span>

        </div>


        <!-- SELECT -->

        <div class="tool-item"
             id="m-select"
             onclick="setMode('select')">

            <i class="fa-solid fa-arrow-pointer"></i>

            <span>SELECT</span>

        </div>


        <!-- ROTATE -->

        <div class="tool-item"
             onclick="rotateDoc()">

            <i class="fa-solid fa-rotate"></i>

            <span>ROTATE</span>

        </div>


        <!-- RECTANGLE -->

        <div class="tool-item active"
             id="s-rect"
             onclick="setShape('rect')">

            <i class="fa-regular fa-square"></i>

            <span>RECTANGLE</span>

        </div>


        <!-- CIRCLE -->

        <div class="tool-item"
             id="s-circle"
             onclick="setShape('circle')">

            <i class="fa-regular fa-circle"></i>

            <span>CIRCLE</span>

        </div>


        <div class="toolbar-divider"></div>


        <!-- COLORS -->

        <div class="color-area">

            <div class="colors">

                <div class="swatch active"
                     data-color="#000000"
                     style="background:#000000;">
                </div>

                <div class="swatch"
                     data-color="#ffffff"
                     style="background:#ffffff;">
                </div>

                <div class="swatch"
                     data-color="#ef4444"
                     style="background:#ef4444;">
                </div>

                <div class="swatch"
                     data-color="#f59e0b"
                     style="background:#f59e0b;">
                </div>

                <div class="swatch"
                     data-color="#facc15"
                     style="background:#facc15;">
                </div>

                <div class="swatch"
                     data-color="#10b981"
                     style="background:#10b981;">
                </div>

                <div class="swatch"
                     data-color="#0ea5e9"
                     style="background:#0ea5e9;">
                </div>

                <div class="swatch"
                     data-color="#7c3aed"
                     style="background:#7c3aed;">
                </div>

                <div class="swatch"
                     data-color="#ec4899"
                     style="background:#ec4899;">
                </div>

            </div>

            <div class="color-label">
                COLOR
            </div>

        </div>


        <!-- DELETE -->

        <div class="delete-area">

            <div class="tool-item delete-btn"
                 onclick="deleteMask()">

                <i class="fa-regular fa-trash-can"></i>

                <span>DELETE</span>

            </div>

        </div>


        <!-- ZOOM -->

        <div class="zoom-area">

            <button class="zoom-btn"
                    onclick="changeZoom(-0.1)">

                <i class="fa-solid fa-minus"></i>

            </button>


            <div class="zoom-value"
                 id="zl">

                100%

            </div>


            <button class="zoom-btn"
                    onclick="changeZoom(0.1)">

                <i class="fa-solid fa-plus"></i>

            </button>

        </div>


        <!-- EXPORT -->

        <button class="export-btn"
                onclick="handleExport()">

            <i class="fa-solid fa-download"></i>

            EXPORT REDACTED

        </button>


    </div>

</header>



<!-- ======================================================
     MAIN VIEWER
====================================================== -->

<div class="viewport" id="viewer">


    <!-- HOME SCREEN -->

    <div id="home"
         class="hero-sec">


        <h1 class="hero-h1">

            PROTECT YOUR
            <br>
            DOCUMENTS

        </h1>


        <div class="hero-subtitle">

            ULTRA-SECURE REDACTION CORE

        </div>


        <!-- UPLOAD BOX -->

        <div class="upload-box"
             onclick="document.getElementById('fileIn').click()">


            <div class="upload-icon">

                <i class="fa-solid fa-cloud-arrow-up"></i>

            </div>


            <div class="upload-title">

                SELECT DATA SOURCE

            </div>


            <div class="upload-subtitle">

                or drag &amp; drop your file here

            </div>


        </div>


    </div>


</div>



<!-- ======================================================
     FILE INPUT
====================================================== -->

<input
    type="file"
    id="fileIn"
    accept="application/pdf,image/*"
>



<script>


/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   VARIABLES
========================================================= */

const viewer =
    document.getElementById('viewer');

let mode = 'draw';

let color = '#000000';

let shape = 'rect';

let zoom = 1.0;

let rotation = 0;

let selected = null;

let fileName = "Document";

let fileType = "pdf";


/* =========================================================
   MODE
========================================================= */

function setMode(m) {

    mode = m;

    document
        .getElementById('m-draw')
        .classList
        .toggle('active', m === 'draw');

    document
        .getElementById('m-select')
        .classList
        .toggle('active', m === 'select');

    deselect();
}


/* =========================================================
   SHAPE
========================================================= */

function setShape(s) {

    shape = s;

    document
        .getElementById('s-rect')
        .classList
        .toggle('active', s === 'rect');

    document
        .getElementById('s-circle')
        .classList
        .toggle('active', s === 'circle');
}


/* =========================================================
   DESELECT
========================================================= */

function deselect() {

    document
        .querySelectorAll('.mask-unit')
        .forEach(m => {

            m.classList.remove('selected');

        });

    selected = null;
}


/* =========================================================
   DELETE
========================================================= */

function deleteMask() {

    if (selected) {

        selected.remove();

        selected = null;

    }
}


/* =========================================================
   ZOOM
========================================================= */

function changeZoom(val) {

    zoom =
        Math.min(
            Math.max(
                0.2,
                zoom + val
            ),
            2.0
        );

    applyTransform();

    document
        .getElementById('zl')
        .innerText =
        Math.round(zoom * 100) + '%';
}


/* =========================================================
   ROTATE
========================================================= */

function rotateDoc() {

    rotation =
        (rotation + 90) % 360;

    applyTransform();
}


/* =========================================================
   TRANSFORM
========================================================= */

function applyTransform() {

    document
        .querySelectorAll('.page-node')
        .forEach(p => {

            p.style.transform =
                `scale(${zoom}) rotate(${rotation}deg)`;

        });
}


/* =========================================================
   COLOR
========================================================= */

document
    .querySelectorAll('.swatch')
    .forEach(s => {

        s.onclick = () => {

            document
                .querySelectorAll('.swatch')
                .forEach(x =>
                    x.classList.remove('active')
                );

            s.classList.add('active');

            color =
                s.dataset.color;

        };

    });


/* =========================================================
   FILE UPLOAD
========================================================= */

document
    .getElementById('fileIn')
    .onchange = async (e) => {

        const file =
            e.target.files[0];

        if (!file) return;


        fileName =
            file.name.split('.')[0];


        fileType =
            file.type.includes('pdf')
                ? 'pdf'
                : 'image';


        document
            .getElementById('home')
            .style.display = 'none';


        viewer.innerHTML = '';


        rotation = 0;

        zoom = 1.0;


        /* PDF */

        if (fileType === "pdf") {

            const buf =
                await file.arrayBuffer();


            const doc =
                await pdfjsLib
                    .getDocument({
                        data: buf
                    })
                    .promise;


            const totalPages =
                doc.numPages;


            for (
                let i = 1;
                i <= totalPages;
                i++
            ) {

                const page =
                    await doc.getPage(i);


                const vp =
                    page.getViewport({
                        scale: 2.0
                    });


                const wrap =
                    createPageNode(
                        vp.width,
                        vp.height,
                        i,
                        totalPages
                    );


                await page.render({

                    canvasContext:
                        wrap
                            .querySelector('canvas')
                            .getContext('2d'),

                    viewport: vp

                }).promise;

            }

        }

        /* IMAGE */

        else {

            const img =
                new Image();


            img.onload = () => {

                const wrap =
                    createPageNode(
                        img.width,
                        img.height,
                        1,
                        1
                    );


                wrap
                    .querySelector('canvas')
                    .getContext('2d')
                    .drawImage(
                        img,
                        0,
                        0
                    );

            };


            img.src =
                URL.createObjectURL(file);

        }

    };


/* =========================================================
   CREATE PAGE
========================================================= */

function createPageNode(
    w,
    h,
    current,
    total
) {

    const div =
        document.createElement('div');


    div.className =
        'page-node';


    div.style.width =
        w + 'px';


    div.style.height =
        h + 'px';


    div.innerHTML = `

        <div class="page-indicator">

            PAGE ${current} / ${total}

        </div>

        <canvas
            width="${w}"
            height="${h}">
        </canvas>

        <div class="layer-draw"></div>

    `;


    viewer.appendChild(div);


    const layer =
        div.querySelector(
            '.layer-draw'
        );


    /* DRAW */

    layer.onmousedown =
        (e) => {

            if (
                mode !== 'draw' ||
                e.button !== 0
            ) return;


            deselect();


            const rect =
                layer.getBoundingClientRect();


            const startX =
                (e.clientX - rect.left)
                / zoom;


            const startY =
                (e.clientY - rect.top)
                / zoom;


            const mask =
                document.createElement('div');


            mask.className =
                `mask-unit ${shape}`;


            mask.style.backgroundColor =
                color;


            mask.style.left =
                startX + 'px';


            mask.style.top =
                startY + 'px';


            layer.appendChild(mask);


            const onMouseMove =
                (ev) => {

                    const curX =
                        (ev.clientX - rect.left)
                        / zoom;


                    const curY =
                        (ev.clientY - rect.top)
                        / zoom;


                    const dw =
                        curX - startX;


                    const dh =
                        curY - startY;


                    mask.style.width =
                        Math.abs(dw) + 'px';


                    mask.style.height =
                        Math.abs(dh) + 'px';


                    mask.style.left =
                        (dw < 0
                            ? curX
                            : startX) + 'px';


                    mask.style.top =
                        (dh < 0
                            ? curY
                            : startY) + 'px';

                };


            window.addEventListener(
                'mousemove',
                onMouseMove
            );


            window.addEventListener(
                'mouseup',
                () => {

                    window.removeEventListener(
                        'mousemove',
                        onMouseMove
                    );


                    mask.onclick =
                        (m) => {

                            if (
                                mode === 'select'
                            ) {

                                m.stopPropagation();

                                deselect();

                                mask.classList
                                    .add('selected');

                                selected =
                                    mask;

                            }

                        };

                },
                {
                    once: true
                }
            );

        };


    return div;

}


/* =========================================================
   EXPORT
========================================================= */

async function handleExport() {

    const pages =
        document.querySelectorAll(
            '.page-node'
        );


    if (!pages.length) return;


    const { jsPDF } =
        window.jspdf;


    let pdf = null;


    for (let p of pages) {

        const canvas =
            p.querySelector('canvas');


        const masks =
            p.querySelectorAll(
                '.mask-unit'
            );


        const out =
            document.createElement('canvas');


        if (
            rotation === 90 ||
            rotation === 270
        ) {

            out.width =
                canvas.height;

            out.height =
                canvas.width;

        } else {

            out.width =
                canvas.width;

            out.height =
                canvas.height;

        }


        const ctx =
            out.getContext('2d');


        ctx.translate(
            out.width / 2,
            out.height / 2
        );


        ctx.rotate(
            rotation *
            Math.PI / 180
        );


        ctx.drawImage(
            canvas,
            -canvas.width / 2,
            -canvas.height / 2
        );


        ctx.setTransform(
            1, 0, 0, 1, 0, 0
        );


        masks.forEach(m => {

            ctx.fillStyle =
                m.style.backgroundColor;


            const ml =
                parseFloat(
                    m.style.left
                );


            const mt =
                parseFloat(
                    m.style.top
                );


            const mw =
                parseFloat(
                    m.style.width
                );


            const mh =
                parseFloat(
                    m.style.height
                );


            if (
                m.classList.contains(
                    'circle'
                )
            ) {

                ctx.beginPath();


                ctx.arc(
                    ml + mw / 2,
                    mt + mh / 2,
                    mw / 2,
                    0,
                    Math.PI * 2
                );


                ctx.fill();

            } else {

                ctx.fillRect(
                    ml,
                    mt,
                    mw,
                    mh
                );

            }

        });


        /* PDF */

        if (fileType === "pdf") {

            const img =
                out.toDataURL(
                    'image/jpeg',
                    0.9
                );


            const pw =
                out.width * 0.75;


            const ph =
                out.height * 0.75;


            if (!pdf) {

                pdf =
                    new jsPDF(
                        pw > ph
                            ? 'l'
                            : 'p',

                        'pt',

                        [pw, ph]
                    );

            } else {

                pdf.addPage(
                    [pw, ph],

                    pw > ph
                        ? 'l'
                        : 'p'
                );

            }


            pdf.addImage(
                img,
                'JPEG',
                0,
                0,
                pw,
                ph
            );


        }

        /* IMAGE */

        else {

            const link =
                document.createElement('a');


            link.download =
                `${fileName}_REDACTED.jpg`;


            link.href =
                out.toDataURL(
                    'image/jpeg',
                    0.9
                );


            link.click();


            return;

        }

    }


    if (pdf) {

        pdf.save(
            `${fileName}_REDACTED.pdf`
        );

    }

}

</script>

</body>
</html>
